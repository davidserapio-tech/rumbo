<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Rumbo · Test vocacional</title>
<meta name="description" content="Rumbo es un test vocacional corto: respondé 16 preguntas y conocé qué carreras encajan con vos.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0E6E78">
<meta property="og:title" content="Rumbo · Test vocacional">
<meta property="og:description" content="Respondé 16 preguntas y conocé qué carreras encajan con vos.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --bg: #F7F5F0; --surface: #FFFFFF; --ink: #111821; --muted: #4A5560; --line: #DAD7D0;
  --primary: #0E6E78; --on-primary: #FFFFFF; --primary-deep: #07434A;
  --card: #94CBD3; --on-card: #111821; --soft: #E5E3DF; --softline: #C8DAD8; --blue: #B7D7E5;
  --dark: #3B404A; --on-dark: #FFFFFF; --artbg: #EAF2F0; color-scheme: light;
  --f: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
html.big { font-size: 20px; }
body { background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 1rem; line-height: 1.45; margin: 0; }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-weight: 500; line-height: 1.15; text-wrap: balance; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.shell { max-width: 520px; margin: 0 auto; min-height: 100vh; position: relative; background: var(--bg); }
.hdr { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; background: var(--bg); border-bottom: 1px solid var(--line); height: 56px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.logo { justify-self: center; background: none; border: 0; cursor: pointer; font-family: var(--f); font-weight: 600; font-size: 1.6rem; letter-spacing: -.02em; color: var(--ink); padding: 4px 8px; }
.logo svg { vertical-align: -3px; margin-left: -2px; }
.icobtn { justify-self: center; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; font-size: .9rem; }
.icobtn[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
main { padding-bottom: 24px; outline: none; }
main.hasnav { padding-bottom: 96px; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.muted { color: var(--muted); }
.tiny { font-size: .8125rem; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 24px; border-radius: 999px; border: 1.5px solid transparent; cursor: pointer; font-weight: 500; font-size: 1rem; text-align: center; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-outline { background: transparent; color: var(--primary); border-color: var(--primary); }
.btn-white { background: #fff; color: var(--primary-deep); }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; color: var(--primary); text-decoration: underline; cursor: pointer; padding: 8px 0; min-height: 44px; }

/* inicio */
.hero { position: relative; overflow: hidden; background: linear-gradient(155deg, #05363C 0%, #0A545C 45%, #0E6E78 100%); color: #fff; padding: 36px max(20px, env(safe-area-inset-left, 0px)) 28px; display: grid; gap: 20px; }
.hero h1 { font-size: 2.35rem; font-weight: 600; max-width: 11em; }
.hero p { font-size: 1.1rem; max-width: 20em; }
.hero .tiny { opacity: .9; }
.hero-art { width: 100%; max-width: 360px; justify-self: end; margin-top: -4px; }
.step { background: var(--card); color: var(--on-card); border-radius: 22px; padding: 22px; display: grid; gap: 10px; }
.step .num { font-size: 2.6rem; font-weight: 400; line-height: 1; }
.step h3 { font-size: 1.35rem; font-weight: 400; }
.step p { font-size: .98rem; }
h2.sec { font-size: 1.6rem; font-weight: 400; }
.cmp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.cmpcard { background: var(--surface); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; border: 1px solid var(--line); }
.cmpcard select { width: 100%; background: var(--soft); border: 0; border-radius: 12px; padding: 10px; min-height: 44px; font-weight: 500; }
.cmpcard dl { margin: 0; display: grid; gap: 8px; }
.cmpcard dt { font-size: .75rem; color: var(--muted); }
.cmpcard dd { margin: 0; font-size: .92rem; }
.foot { background: var(--primary); color: #fff; padding: 28px max(20px, env(safe-area-inset-left, 0px)) 120px; display: grid; gap: 14px; margin-top: 8px; }
.foot .logo { color: #fff; justify-self: start; padding-left: 0; }
.foot a, .foot button.fl { color: #fff; background: none; border: 0; text-align: left; padding: 6px 0; cursor: pointer; font-size: 1rem; }
.foot small { opacity: .85; }

.bnav { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 520px; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); z-index: 12; }
.bnav button { background: none; border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .75rem; color: var(--muted); padding: 6px 0; min-height: 52px; }
.bnav button[aria-current="page"] { color: var(--primary); font-weight: 600; }
.bnav svg { width: 24px; height: 24px; }
.bnav .fab { position: relative; }
.bnav .fab span.c { position: absolute; top: -26px; width: 54px; height: 54px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; box-shadow: 0 4px 10px rgba(0,0,0,.2); }
.bnav .fab em { font-style: normal; margin-top: 26px; }

/* formularios */
.qhead { display: flex; justify-content: space-between; align-items: center; padding: 14px 0 10px; }
.qhead button { background: none; border: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; font-size: .95rem; min-height: 44px; padding: 0; }
.qhead span { font-size: .85rem; color: var(--muted); }
.bar4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.bar4 i { height: 6px; border-radius: 99px; background: var(--softline); position: relative; overflow: hidden; display: block; }
.bar4 i b { position: absolute; inset: 0 auto 0 0; background: var(--primary); display: block; }
.ftitle { font-size: 1.9rem; font-weight: 400; padding-top: 6px; }
label.l { font-size: .92rem; font-weight: 500; }
.inp { width: 100%; background: var(--soft); border: 1.5px solid transparent; border-radius: 16px; padding: 14px 16px; min-height: 52px; color: var(--ink); }
.inp:focus { border-color: var(--primary); outline: none; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--soft); border-radius: 16px; overflow: hidden; }
.seg button { background: transparent; border: 0; min-height: 52px; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); font-weight: 500; }
.sugg { background: var(--surface); border: 1.5px solid var(--muted); border-radius: 16px; overflow: hidden; }
.sugg button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 14px 16px; cursor: pointer; min-height: 48px; }
.sugg button:hover { background: var(--soft); }
.chip { display: inline-flex; align-items: center; gap: 8px; background: var(--card); color: var(--on-card); border-radius: 99px; padding: 6px 12px; font-size: .85rem; border: 0; }
.chip button { background: none; border: 0; cursor: pointer; font-size: 1rem; line-height: 1; padding: 4px; min-width: 24px; min-height: 24px; }

.qcat { font-size: .82rem; color: var(--muted); padding-top: 18px; }
.qtitle { font-size: 2rem; font-weight: 400; padding: 4px 0 14px; }
.opts { display: grid; gap: 10px; }
.pill { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; min-height: 56px; padding: 12px 20px; border-radius: 18px; border: 1.5px solid var(--softline); background: var(--surface); cursor: pointer; font-size: 1.02rem; }
.pill:hover { border-color: var(--primary); }
.pill[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.pill.art { }
.prow { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 8px 16px 8px 8px; border-radius: 20px; border: 1.5px solid var(--softline); background: var(--surface); cursor: pointer; min-height: 84px; font-size: 1.02rem; }
.prow:hover { border-color: var(--primary); }
.prow[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.prow .art { flex: none; width: 112px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.imgcard { display: flex; flex-direction: column; gap: 8px; padding: 8px; border-radius: 20px; border: 1.5px solid var(--softline); background: var(--surface); cursor: pointer; text-align: left; min-width: 0; font-size: .98rem; }
.imgcard:hover { border-color: var(--primary); }
.imgcard[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.imgcard span.t { padding: 0 6px 6px; }
.art { aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden; background: var(--artbg); min-width: 0; max-width: 100%; }
.art svg { display: block; width: 100%; height: 100%; }
.art svg rect, .art svg circle, .art svg ellipse, .art svg path:not([fill="none"]) { stroke: #111821; stroke-width: 1.3; stroke-linejoin: round; }
.hint { font-size: .9rem; color: var(--muted); margin-top: -6px; padding-bottom: 6px; }

/* análisis */
.analyze { min-height: 70vh; display: grid; place-content: center; gap: 16px; text-align: center; padding: 0 32px; }
.pbar { height: 8px; border-radius: 99px; background: var(--softline); overflow: hidden; width: min(320px, 70vw); margin: 0 auto; }
.pbar > div { height: 100%; width: 0; background: var(--primary); transition: width 1.7s ease-out; }

/* resultado */
.pcard { background: var(--card); color: var(--on-card); border-radius: 22px; padding: 18px; display: grid; gap: 14px; }
.ptag { display: flex; align-items: center; gap: 10px; background: color-mix(in srgb, var(--surface) 55%, transparent); border-radius: 12px; padding: 14px; font-weight: 500; }
.ptag svg { flex: none; }
.pcard p { font-size: .92rem; line-height: 1.5; }
.ccard { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: grid; gap: 12px; }
.ccard .ctop { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.ccard h3 { font-size: 1.25rem; font-weight: 500; }
.pct { font-size: 1.15rem; font-weight: 500; color: var(--primary); white-space: nowrap; }
.ccard ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: .9rem; }
.ccard li { display: flex; gap: 10px; align-items: flex-start; }
.ccard li svg { flex: none; margin-top: 2px; color: var(--primary); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { border: 1.5px solid var(--softline); border-radius: 99px; padding: 3px 11px; font-size: .82rem; background: var(--surface); }
.tag.p { border-color: var(--primary); color: var(--primary); font-weight: 500; }
.note { background: var(--card); color: var(--on-card); border-radius: 16px; padding: 14px 16px; display: grid; gap: 10px; }
details { border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; background: var(--surface); }
summary { cursor: pointer; font-weight: 500; min-height: 32px; display: flex; align-items: center; }
details ul { margin: 8px 0 0; padding-left: 1.1rem; display: grid; gap: 4px; font-size: .92rem; }
.sect h3 { font-size: 1.15rem; font-weight: 500; padding-bottom: 6px; }
.sect ul { margin: 0; padding-left: 1.1rem; display: grid; gap: 4px; font-size: .95rem; }
.dur { display: grid; grid-template-columns: repeat(2, 1fr); text-align: center; gap: 8px; }
.dur b { display: block; font-size: 1.5rem; font-weight: 400; }

/* diálogo */
.dback { position: fixed; inset: 0; background: rgba(10, 18, 20, .55); display: grid; place-items: center; padding: 16px; z-index: 40; animation: fade .18s; }
.dlg { width: 100%; max-width: 420px; background: var(--surface); color: var(--ink); border-radius: 20px; padding: 22px; display: grid; gap: 14px; position: relative; max-height: 88vh; overflow: auto; }
.dlg h2 { font-size: 1.35rem; font-weight: 500; padding-right: 32px; }
.dlg .x { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border: 0; background: none; cursor: pointer; font-size: 1.6rem; color: var(--ink); }
.dlg .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dlg ul { margin: 0; padding-left: 1.1rem; display: grid; gap: 4px; }
@keyframes fade { from { opacity: 0; } }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-size: .9rem; z-index: 50; max-width: 90vw; }
.listq { display: grid; gap: 10px; }
.qrow { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 12px 14px; display: grid; gap: 6px; min-width: 0; }
.qrow ul { margin: 0; padding-left: 1.1rem; }
.imgtag { display: inline-block; border: 1.5px dashed var(--muted); border-radius: 8px; padding: 1px 8px; font-size: .78rem; color: var(--muted); }
.search { position: relative; }
.fchips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.fchips button { flex: none; border: 1.5px solid var(--softline); background: var(--surface); border-radius: 99px; padding: 6px 14px; cursor: pointer; min-height: 40px; }
.fchips button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.lcard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: grid; gap: 8px; text-align: left; cursor: pointer; width: 100%; }
.lcard:hover { border-color: var(--primary); }
@media (prefers-reduced-motion: reduce) { .pbar > div { transition: none; } .dback { animation: none; } }
.bnav[hidden], .toast[hidden] { display: none; }
main.hasnav { padding-bottom: 0; }

html, body { overflow-x: hidden; max-width: 100%; }
.hero { padding-bottom: 0; min-height: 520px; background: radial-gradient(120% 70% at 78% 78%, rgba(88,170,180,.55) 0%, rgba(14,110,120,0) 60%), linear-gradient(165deg, #04343A 0%, #09505A 55%, #0E6E78 100%); display: block; }
.hero .copy { position: relative; z-index: 2; display: grid; gap: 16px; max-width: 78%; padding-bottom: 8px; }
.hero h1 { font-size: 2.3rem; }
.hero .photo { position: absolute; right: 0; bottom: 0; height: 66%; width: auto; max-width: 62%; object-fit: contain; object-position: bottom right; z-index: 1; pointer-events: none; }
.foot { padding: 32px max(20px, env(safe-area-inset-left, 0px)) calc(110px + env(safe-area-inset-bottom, 0px)); gap: 6px; background: #0E6E78; }
.foot .flogo { justify-self: center; font-family: var(--f); font-weight: 600; font-size: 2rem; color: #111821; letter-spacing: -.02em; display: inline-flex; align-items: center; gap: 2px; padding: 4px 0 18px; }
.foot .fl { font-size: 1.1rem; padding: 12px 0; min-height: 48px; font-weight: 400; }
.foot .ask { font-size: 1.05rem; padding-top: 22px; }
.foot form { display: grid; grid-template-columns: minmax(0, 1fr) 48px; gap: 10px; align-items: center; padding: 6px 0 10px; }
.foot form input { background: #E5E3DF; color: #111821; border: 0; border-radius: 99px; padding: 0 20px; min-height: 48px; min-width: 0; width: 100%; }
.foot form button { width: 48px; height: 48px; border-radius: 50%; border: 0; background: #E5E3DF; color: #0E6E78; display: grid; place-items: center; cursor: pointer; padding: 0; }
.foot hr { border: 0; border-top: 1px solid rgba(255,255,255,.55); margin: 10px 0; width: 100%; }
.foot .social { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
.foot .social .icons { display: flex; gap: 12px; }
.foot .social button { background: none; border: 0; color: #fff; cursor: pointer; width: 44px; height: 44px; display: grid; place-items: center; padding: 0; }
.foot small { font-size: 1rem; opacity: 1; padding-top: 6px; }

.logo { display: inline-flex; align-items: center; justify-content: center; line-height: 0; }
.logo img, .flogo img { display: block; height: 28px; width: auto; }
.foot { padding: 24px max(20px, env(safe-area-inset-left, 0px)) calc(24px + 76px + env(safe-area-inset-bottom, 0px)); gap: 0; }
.foot .flogo { padding: 4px 0 14px; }
.foot .flogo img { height: 30px; }
.foot .fl { font-size: 1.05rem; padding: 8px 0; min-height: 40px; display: block; width: 100%; }
.foot .ask { font-size: 1rem; padding-top: 16px; line-height: 1.35; }
.foot form { padding: 10px 0 12px; }
.foot hr { margin: 8px 0; }
.foot .social { padding: 2px 0; }
.foot small { font-size: .95rem; padding-top: 6px; }
</style>
</head>

function toast(msg) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2200);
}
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }

function nav(v, o) { S.stack.push({ v: S.v, n: S.n, career: S.career, from: S.from }); Object.assign(S, { v }, o || {}); render(); }
function repl(v, o) { Object.assign(S, { v }, o || {}); render(); }
function back() {
  const p = S.stack.pop();
  if (!p) { repl('home'); return; }
  S.v = p.v; S.n = p.n; S.career = p.career; S.from = p.from; render();
}
function answered() { return Object.keys(S.a.i).length + Object.keys(S.a.s).length + ['place', 'indep', 'gente', 'dur', 'trab', 'dist', 'inst', 'cuota'].filter(k => S.a[k]).length; }
function tab(v) {
  const go = () => { S.stack = []; repl(v); };

  go();
}

function closeDlg() { const d = $('#dlg'); if (d) d.remove(); document.removeEventListener('keydown', closeDlg.k); }

function saveResult() { store('rumbo.saved', { a: S.a, date: new Date().toISOString() }); toast('Guardado en tu perfil'); }
function profileName(a) {
  const likes = Object.keys(INT).filter(k => (a.i || {})[k] === 2);
  const names = likes.slice(0, 2).map(k => ADJ[k]);
  if (!names.length) return 'Perfil Explorador';
  return 'Perfil ' + names.join(' y ');
}
function profileText(a) {
  const likes = Object.keys(INT).filter(k => (a.i || {})[k] === 2).map(k => INT[k].r);
  const good = Object.keys(SK).filter(k => (a.s || {})[k] === 2).map(k => SK[k].r);
  let t = likes.length ? 'Tenés una marcada inclinación hacia ' + likes.slice(0, 3).join(', ').replace(/, ([^,]*)$/, ' y $1') + '.' : 'Todavía estás explorando qué te interesa, y eso es un buen punto de partida.';
  if (good.length) t += ' Se te da bien ' + good.slice(0, 2).join(' y ') + '.';
  if (a.place || a.gente) t += ' Te imaginás trabajando ' + (a.place ? { ofi: 'en una oficina', casa: 'desde tu casa', afuera: 'al aire libre o viajando', lab: 'en un laboratorio, taller o consultorio' }[a.place] : '') + (a.gente ? (a.place ? ', ' : '') + (a.gente === 'gente' ? 'en contacto con personas' : 'concentrado detrás de escena') : '') + '.';
  return t + ' Es una orientación para explorar carreras, no un diagnóstico.';
}
function shareText(a, r) {
  return ['Mi perfil en Rumbo: ' + profileName(a), ''].concat(r.top.map((x, i) => (i + 1) + '. ' + x.c.n + ' · afinidad ' + x.pct + '% · ' + x.c.y)).concat(['', 'Resultado orientativo de Rumbo. No es un diagnóstico.']).join('\n');
}
function share(a, r) {
  const text = shareText(a, r);
  const copy = () => {
    const done = () => toast('Resultado copiado');
    try { navigator.clipboard.writeText(text).then(done, () => toast('No se pudo copiar')); } catch (e) { toast('No se pudo copiar'); }
  };
  try { if (navigator.share) { navigator.share({ text }).catch(() => {}); return; } } catch (e) { /* sin share */ }
  copy();
}
function roles(c) {
  const ints = Object.keys(c.i).sort((x, y) => c.i[y] - c.i[x]).slice(0, 2).map(k => INT[k].r);
  const sk = Object.keys(c.s).sort((x, y) => c.s[y] - c.s[x]).slice(0, 2).map(k => SK[k].r);
  return { ints, sk };
}

const LAB = {
  dur: { corta: 'Carrera corta (1 a 3 años)', media: 'Carrera de 4 años', larga: 'Carrera de 5 años o más' },
  mod: { presencial: 'Presencial', virtual: 'Virtual', hibrida: 'Híbrida' },
  dist: { cerca: 'Cerca de tu casa', prov: 'En tu provincia', pais: 'En cualquier lugar del país' },
  inst: { publica: 'Pública y gratuita', privada: 'Privada' },
  cuota: { nopaga: 'Sin cuota', baja: 'Cuota baja', media: 'Cuota media', alta: 'Cuota alta' },
  prio: { pasion: 'Que te apasione', salida: 'Salida laboral rápida', ingreso: 'Que se gane bien', estable: 'Que sea estable' }
};

function profileOf(a) {
  const ui = a.i || {}, us = a.s || {};
  const likes = Object.keys(INT).filter(k => ui[k] === 2).map(k => INT[k].s);
  const maybe = Object.keys(INT).filter(k => ui[k] === 1).map(k => INT[k].s);
  const good = Object.keys(SK).filter(k => us[k] === 2).map(k => SK[k].s);
  const filters = [];
  if (LAB.dur[a.dur]) filters.push(LAB.dur[a.dur]);
  if (LAB.mod[a.mod]) filters.push(LAB.mod[a.mod]);
  if (LAB.dist[a.dist]) filters.push(LAB.dist[a.dist] + (a.dist === 'prov' && a.loc ? ' (' + a.loc + ')' : ''));
  if (LAB.inst[a.inst]) filters.push(LAB.inst[a.inst]);
  if (a.inst !== 'publica' && LAB.cuota[a.cuota]) filters.push(LAB.cuota[a.cuota]);
  const prio = (a.prio || []).map(p => LAB.prio[p]);
  return { likes, maybe, good, filters, prio };
}

function vCareers() {
  const q = S.q.toLowerCase();
  const list = CAREERS.filter(c => (!S.fam || c.f === S.fam) && (!q || c.n.toLowerCase().includes(q)));
  app.innerHTML = '<div class="stack pad" style="padding-top:18px"><h1 class="ftitle">Carreras</h1>' +
    '<input class="inp" id="csearch" type="search" placeholder="Buscá una carrera" value="' + esc(S.q) + '" aria-label="Buscar carrera">' +
    '<div class="fchips"><button data-fam="" aria-pressed="' + !S.fam + '">Todas</button>' + Object.keys(FAMILY).map(f => '<button data-fam="' + f + '" aria-pressed="' + (S.fam === f) + '">' + esc(FAMILY[f]) + '</button>').join('') + '</div>' +
    '<div class="stack" style="gap:10px" id="clist">' + (list.length ? list.map(c => '<button class="lcard" data-act="career:' + c.id + '"><b style="font-weight:500;font-size:1.1rem">' + esc(c.n) + '</b><span class="muted tiny">' + esc(FAMILY[c.f]) + ' · ' + esc(c.y) + '</span></button>').join('') : '<p class="muted">No encontramos carreras con esa búsqueda.</p>') + '</div>' +
    '<p class="tiny muted">Catálogo de ejemplo. Estamos sumando más carreras e instituciones.</p></div>';
  $('#csearch').oninput = e => { S.q = e.target.value; const pos = e.target.selectionStart; vCareers(); const n = $('#csearch'); n.focus(); n.setSelectionRange(pos, pos); };
  app.querySelectorAll('[data-fam]').forEach(b => { b.onclick = () => { S.fam = b.dataset.fam; vCareers(); }; });
}
function vReels() {
  app.innerHTML = '<div class="analyze"><h1 class="ftitle">Reels</h1><p class="muted">Muy pronto vas a poder ver videos cortos de estudiantes y profesionales contando cómo es cada carrera.</p><button class="btn btn-primary" data-act="start">Hacer el test</button></div>';
}
function vProfile() {
  const sv = store('rumbo.saved');
  if (!sv) { app.innerHTML = '<div class="analyze"><h1 class="ftitle">Tu perfil</h1><p class="muted">Todavía no guardaste ningún resultado. Hacé el test y guardalo acá.</p><button class="btn btn-primary" data-act="start">Comenzar test</button></div>'; return; }
  const r = rank(sv.a);
  app.innerHTML = '<div class="stack pad" style="padding-top:18px"><h1 class="ftitle">' + (sv.a.name ? esc(sv.a.name) + ', tu perfil' : 'Tu perfil') + '</h1>' +
    '<div class="pcard"><div class="ptag">' + IC.face + esc(profileName(sv.a)) + '</div><p>' + esc(profileText(sv.a)) + '</p></div>' +
    '<h2 class="sec" style="font-size:1.3rem">Lo más compatible</h2>' + r.top.map(x => '<button class="lcard" data-act="career:' + x.c.id + '"><span class="row" style="justify-content:space-between;width:100%"><b style="font-weight:500;font-size:1.1rem">' + esc(x.c.n) + '</b><span class="pct">' + x.pct + '%</span></span><span class="muted tiny">' + esc(x.c.y) + '</span></button>').join('') +
    '<button class="btn btn-primary wide" id="viewres">Ver resultado completo</button><button class="link" id="delres">Borrar mi resultado guardado</button></div>';
  $('#viewres').onclick = () => { S.a = JSON.parse(JSON.stringify(sv.a)); nav('result', { early: 0 }); };
  $('#delres').onclick = () => { try { localStorage.removeItem('rumbo.saved'); } catch (e) { /* sin storage */ } vProfile(); };
}

function qHead(label, stepTxt, fillBlocks) {
  const segs = [0, 1, 2, 3].map(b => '<i><b style="width:' + Math.round(Math.max(0, Math.min(1, fillBlocks - b)) * 100) + '%"></b></i>').join('');
  return '<div class="qhead"><button id="back">' + IC.arrow + '<span style="color:var(--ink);font-size:.95rem">Atrás</span></button><span>' + stepTxt + '</span></div><div class="bar4" role="progressbar" aria-label="Avance" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(fillBlocks * 25) + '">' + segs + '</div>';
}
function vData() {
  const a = S.a;
  app.innerHTML = '<div class="pad">' + qHead('', 'Paso 1 de 17', 0) + '<div class="stack" style="padding-top:12px"><h1 class="ftitle">Completá tus datos</h1>' +
    '<div class="stack" style="gap:8px"><label class="l" for="f-name">Nombre</label><input class="inp" id="f-name" placeholder="Ej.: Sofía" autocomplete="given-name" value="' + esc(a.name) + '"></div>' +
    '<div class="stack" style="gap:8px"><label class="l" for="f-loc">Ubicación</label><select class="inp" id="f-loc"><option value="">Seleccioná tu ubicación</option>' + PROVS.map(p => '<option' + (a.loc === p ? ' selected' : '') + '>' + p + '</option>').join('') + '</select></div>' +
    '<div class="stack" style="gap:8px"><span class="l" style="font-weight:500;font-size:.92rem" id="l-mod">Modalidad de cursada</span><div class="seg" role="group" aria-labelledby="l-mod">' + [['virtual', 'Virtual'], ['presencial', 'Presencial'], ['hibrida', 'Híbrida']].map(m => '<button data-mod="' + m[0] + '" aria-pressed="' + (a.mod === m[0]) + '">' + m[1] + '</button>').join('') + '</div></div>' +
    '<div class="stack" style="gap:8px"><label class="l" for="f-hob">Hobbies</label><input class="inp" id="f-hob" placeholder="Buscá tus hobbies" autocomplete="off"><div id="sugg"></div><div class="row" id="hchips">' +
    a.hobbies.map(h => '<span class="chip">' + esc(h) + '<button data-rm="' + esc(h) + '" aria-label="Quitar ' + esc(h) + '">×</button></span>').join('') + '</div></div>' +
    '<button class="btn btn-primary wide" id="next">Siguiente</button></div></div>';
  $('#back').onclick = back;
  $('#f-name').oninput = e => { a.name = e.target.value.trim().slice(0, 30); };
  $('#f-loc').onchange = e => { a.loc = e.target.value; };
  app.querySelectorAll('[data-mod]').forEach(b => { b.onclick = () => { a.mod = a.mod === b.dataset.mod ? '' : b.dataset.mod; vData(); const n = app.querySelector('[data-mod="' + b.dataset.mod + '"]'); if (n) n.focus(); }; });
  const hin = $('#f-hob');
  hin.oninput = () => {
    const t = hin.value.trim().toLowerCase();
    const m = t ? HOBBIES.map(h => h[0]).filter(h => h.toLowerCase().includes(t) && !a.hobbies.includes(h)).slice(0, 5) : [];
    $('#sugg').innerHTML = m.length ? '<div class="sugg">' + m.map(h => '<button data-add="' + esc(h) + '">' + esc(h) + '</button>').join('') + '</div>' : '';
    app.querySelectorAll('[data-add]').forEach(b => { b.onclick = () => { a.hobbies.push(b.dataset.add); vData(); $('#f-hob').focus(); }; });
  };
  app.querySelectorAll('[data-rm]').forEach(b => { b.onclick = () => { a.hobbies = a.hobbies.filter(h => h !== b.dataset.rm); vData(); }; });
  $('#next').onclick = () => nav('q', { n: 1 });
}

function afterAnswer() {
  const n = S.n;
  if (n === 16) { S.early = 0; nav('analyzing'); return; }
  let nx = n + 1;
  if (nx === 15 && S.a.inst === 'publica') nx = 16;
  if (n % 4 === 0) { blockDialog(n / 4, n, nx); return; }
  nav('q', { n: nx });
}
function pickStore(q) { return q.kind === 'i' ? S.a.i : S.a.s; }
function pickSel(q) { const st = pickStore(q); return q.opts.filter(o => st[o.v] === 2).map(o => o.v); }
function setPick(q, sel) { const st = pickStore(q); q.opts.forEach(o => { st[o.v] = sel.includes(o.v) ? 2 : 0; }); }
function vQ() {
  const q = byN(S.n), a = S.a;
  const fill = (S.n - 1) / 4;
  let body = '';
  if (q.type === 'pick') {
    const sel = pickSel(q), st = pickStore(q);
    const ans = q.opts.every(o => st[o.v] !== undefined);
    const extras = q.kind === 'i' ? [['__none', 'Ninguno de estos', ans && !sel.length]] : [['__both', 'Las dos', sel.length === q.opts.length], ['__none', 'Ninguna', ans && !sel.length]];
    body = '<div class="opts">' + q.opts.map(o => o.img
      ? '<button class="prow" data-v="' + o.v + '" aria-pressed="' + (sel.length === 1 && sel[0] === o.v) + '">' + art(o.img, o.l, '') + '<span>' + esc(o.l) + '</span></button>'
      : '<button class="pill" data-v="' + o.v + '" aria-pressed="' + (sel.length === 1 && sel[0] === o.v) + '">' + esc(o.l) + '</button>').join('') +
      extras.map(e => '<button class="pill" data-v="' + e[0] + '" aria-pressed="' + e[2] + '">' + e[1] + '</button>').join('') + '</div>';
  } else if (q.type === 'imgs') {
    body = '<div class="grid2">' + q.opts.map(o => '<button class="imgcard" data-v="' + o.v + '" aria-pressed="' + (a[q.key] === o.v) + '">' + art(q.key + '_' + o.v, o.img, '') + '<span class="t">' + esc(o.l) + '</span></button>').join('') + '</div>';
  } else {
    const sel = q.type === 'multi' ? (a[q.key] || []) : [a[q.key]];
    body = '<div class="opts">' + q.opts.map(o => '<button class="pill" data-v="' + o.v + '" aria-pressed="' + sel.includes(o.v) + '">' + esc(o.l) + '</button>').join('') + '</div>';
  }
  app.innerHTML = '<div class="pad">' + qHead('', 'Paso ' + (S.n + 1) + ' de 17', fill) + '<p class="qcat">' + esc(q.cat) + '</p><h1 class="qtitle" id="qt">' + esc(q.text) + '</h1>' + (q.hint && q.type === 'pick' ? '<p class="hint">' + esc(q.hint) + '</p>' : '') + body + '</div>';
  $('#back').onclick = back;
  app.querySelectorAll('[data-v]').forEach(b => { b.onclick = () => {
    const v = b.dataset.v;
    if (q.type === 'pick') setPick(q, v === '__none' ? [] : (v === '__both' ? q.opts.map(o => o.v) : [v]));
    else if (q.type === 'multi') a[q.key] = [v];
    else a[q.key] = v;
    b.setAttribute('aria-pressed', 'true');
    setTimeout(afterAnswer, 130);
  }; });
}
function vAnalyzing() {
  app.innerHTML = '<div class="analyze" role="status"><h1 style="font-size:1.4rem;font-weight:500">Analizando tu perfil</h1><div class="pbar"><div id="pb"></div></div></div>';
  const red = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  requestAnimationFrame(() => { const p = $('#pb'); if (p) p.style.width = '100%'; });
  clearTimeout(vAnalyzing.t);
  vAnalyzing.t = setTimeout(() => { if (S.v === 'analyzing') { S.stack.pop(); repl('result', { early: 0 }); } }, red ? 300 : 1900);
}

function vResult() {
  const a = S.a, r = rank(a), p = profileOf(a);
  const maxS = r.top[0] ? r.top[0].s : 0;
  let h = '<div class="stack pad" style="padding-top:20px">';
  if (S.early) h += '<div class="note"><p class="tiny"><b>Este resultado usa tus primeras ' + S.early + ' respuestas de 16.</b> Si seguís respondiendo, se ajusta mejor.</p><button class="btn btn-primary" id="resume">Seguir respondiendo</button></div>';
  h += '<h1 class="ftitle" style="padding-top:0">' + (a.name ? esc(a.name) + ', conocé tu perfil' : 'Conocé tu perfil') + '</h1>' +
    '<div class="pcard"><div class="ptag">' + IC.face + esc(profileName(a)) + '</div><p>' + esc(profileText(a)) + '</p></div>' +
    '<div class="stack" style="gap:10px"><button class="btn btn-primary wide" id="save">Guardar mi resultado</button><button class="btn btn-outline wide" id="share">Compartir</button></div>' +
    '<h2 class="sec" style="font-size:1.4rem;padding-top:8px">' + (maxS < 0.35 ? 'Algunas ideas para explorar' : 'Lo más compatible') + '</h2>';
  r.top.forEach(x => {
    h += '<article class="ccard"><div class="ctop"><h3>' + esc(x.c.n) + '</h3><span class="pct">' + x.pct + '%</span></div>' +
      '<ul><li>' + IC.clock + '<span>' + esc(x.c.y) + '</span></li><li>' + IC.bag + '<span>Salida laboral ' + LV[x.c.sa] + ' (estimada)</span></li><li>' + IC.pin + '<span>Instituciones: muy pronto</span></li></ul>' +
      (reasons(a, x.c).length ? '<div class="tags">' + reasons(a, x.c).slice(0, 2).map(w => '<span class="tag">' + esc(w) + '</span>').join('') + '</div>' : '') +
      '<button class="btn btn-outline wide" data-act="career:' + x.c.id + '">Saber más</button></article>';
  });
  if (p.filters.length) h += '<div class="stack" style="gap:8px"><h2 class="sec" style="font-size:1.15rem">Filtros para las instituciones</h2><div class="tags">' + p.filters.map(f => '<span class="tag p">' + esc(f) + '</span>').join('') + '</div></div>';
  h += '<div class="stack" style="gap:8px"><h2 class="sec" style="font-size:1.15rem">Otras opciones cerca de tu perfil</h2><ul style="margin:0;padding-left:1.1rem;display:grid;gap:4px">' + r.others.map(x => '<li><b style="font-weight:500">' + esc(x.c.n) + '</b> · ' + x.pct + '% · ' + esc(x.c.y) + '</li>').join('') + '</ul></div>' +
    '<details><summary>Cómo se calcula este resultado</summary><ul><li>Comparamos tus intereses (55%), tus habilidades (25%) y cómo te imaginás trabajando (20%) con el perfil de cada carrera del catálogo de ejemplo.</li><li>Si elegiste "Que me apasione", los intereses pesan más (65%).</li><li>La duración, la cursada a distancia, si querés trabajar mientras estudiás y tus prioridades suman o restan unos pocos puntos.</li><li>Tus hobbies suman un poco de interés en esa área.</li><li>Mostramos las 3 con más afinidad, con no más de 2 de la misma familia.</li><li>La afinidad es una estimación para orientarte, no un diagnóstico.</li></ul></details>' +
    '<div class="row" style="justify-content:space-between"><button class="link" id="back">← Atrás</button><button class="btn btn-outline" id="again">Hacer el test de nuevo</button></div></div>';
  app.innerHTML = h;
  const rs = $('#resume'); if (rs) rs.onclick = () => { S.early = 0; nav('q', { n: S.resume }); };
  $('#save').onclick = saveResult; $('#share').onclick = () => share(a, r); $('#back').onclick = back;
  $('#again').onclick = () => { S.a = newA(); S.early = 0; S.stack = []; repl('data'); };
}
function vCareer() {
  const c = CMAP[S.career]; if (!c) { repl('home'); return; }
  const r = roles(c);
  const hasRes = S.from === 'result' || S.from === 'profile';
  let pct = '';
  if (hasRes) { const x = rank(S.a).all.find(z => z.c.id === c.id); if (x) pct = '<p class="tiny muted">' + pctOf(x.s) + '% de afinidad estimada con tu perfil</p>'; }
  app.innerHTML = '<div class="stack pad" style="padding-top:8px"><div class="qhead"><button id="back">' + IC.arrow + '<span style="font-size:.95rem">Atrás</span></button></div>' +
    '<h1 class="ftitle" style="padding-top:0">' + esc(c.n) + '</h1>' + pct +
    '<p>Carrera del área de ' + esc(FAMILY[c.f].toLowerCase()) + '. Combina ' + esc(r.ints.join(' y ')) + (r.sk.length ? ', con foco en ' + esc(r.sk.join(' y ')) : '') + '.</p>' +
    '<div class="stack" style="gap:10px"><button class="btn btn-primary wide" id="csave">Guardar mi resultado</button><button class="btn btn-outline wide" id="cshare">Compartir</button></div>' +
    '<div class="sect"><h3>Duración</h3><p>' + esc(c.y) + '</p><p class="tiny muted">Puede variar según la institución.</p></div>' +
    '<div class="sect"><h3>Instituciones</h3><p class="muted">Muy pronto vas a ver acá dónde estudiarla, con cuota, modalidad y ubicación.</p></div>' +
    '<div class="sect"><h3>Salida laboral (estimada)</h3><ul><li>Demanda laboral: ' + LV[c.sa] + '</li><li>Ingresos: ' + LV[c.ig] + '</li><li>Estabilidad: ' + LV[c.es] + '</li></ul></div>' +
    '<div class="sect"><h3>Perfil del graduado</h3><p>Suele encajar con personas interesadas en ' + esc(r.ints.join(' y ')) + (r.sk.length ? ' y a quienes se les da bien ' + esc(r.sk.join(' y ')) : '') + '.</p></div>' +
    '<p class="tiny muted">Datos de ejemplo del prototipo: hay que validarlos con fuentes reales.</p></div>';
  $('#back').onclick = back;
  const rr0 = rank(S.a);
  $('#csave').onclick = () => { if (answered() || (S.a.hobbies || []).length) saveResult(); else toast('Hacé el test para guardar tu resultado'); };
  $('#cshare').onclick = () => { try { navigator.clipboard.writeText(c.n + ' (' + c.y + ') · Rumbo').then(() => toast('Copiado'), () => toast('No se pudo copiar')); } catch (e) { toast('No se pudo copiar'); } };
}

/* panel del equipo */
function vTeam() {
  if (!S.team) {
    app.innerHTML = '<div class="stack pad" style="padding-top:20px"><p class="tiny muted">Solo equipo</p><h1 class="ftitle" style="padding-top:0">Panel del equipo</h1><p class="muted">Ingresá el código para ver los perfiles de ejemplo y el listado de preguntas.</p>' +
      '<label class="l" for="code">Código</label><input class="inp" id="code" type="password" autocomplete="off"><p id="cerr" class="tiny" hidden>Código incorrecto.</p><button class="btn btn-primary" id="enter">Entrar</button><button class="link" id="out">← Volver</button></div>';
    const ok = () => { if ($('#code').value.trim().toLowerCase() === 'rumbo5') { S.team = true; vTeam(); } else $('#cerr').hidden = false; };
    $('#enter').onclick = ok; $('#code').onkeydown = e => { if (e.key === 'Enter') ok(); }; $('#out').onclick = () => repl('home');
    return;
  }
  app.innerHTML = '<div class="stack pad" style="padding-top:20px"><p class="tiny muted">Solo equipo</p><h1 class="ftitle" style="padding-top:0">Panel del equipo</h1><p class="muted tiny">Atajos para revisar resultados. Los porcentajes son estimativos.</p>' +
    '<div class="opts">' + DEMOS.map(d => '<button class="pill" data-demo="' + d.id + '">' + esc(d.t) + '</button>').join('') + '</div><button class="btn btn-outline" id="all">Ver listado de preguntas</button><button class="link" id="out">← Volver</button></div>';
  app.querySelectorAll('[data-demo]').forEach(b => { b.onclick = () => { const d = DEMOS.find(x => x.id === b.dataset.demo); S.a = Object.assign(newA(), JSON.parse(JSON.stringify(d.a))); S.stack = []; nav('result', { early: 0 }); }; });
  $('#all').onclick = () => nav('all'); $('#out').onclick = () => repl('home');
}
function vAll() {
  let last = '', h = '<div class="pad"><div class="qhead"><button id="back">' + IC.arrow + '<span style="font-size:.95rem">Atrás</span></button></div><h1 class="ftitle" style="padding-top:0">16 preguntas en 4 bloques</h1><p class="muted tiny">Datos previos: nombre, ubicación, modalidad y hobbies. Cada pregunta avanza con un toque. Al final de cada bloque aparece una ventana con una primera idea del perfil. La pregunta 15 se saltea si en la 14 se elige "Pública y gratuita".</p><div class="listq">';
  Q.forEach(q => {
    const hd = 'Bloque ' + Math.ceil(q.n / 4) + ' de 4'; if (hd !== last) { h += '<h2 style="font-size:1.1rem;padding-top:12px;color:var(--primary)">' + hd + '</h2>'; last = hd; }
    const opts = q.opts.map(o => '<li>' + esc(o.l) + (o.img ? ' <span class="imgtag">Ilustración: ' + esc((ART[o.img] || ART[q.key + '_' + o.v] || [0, o.img])[1]) + '</span>' : '') + '</li>').join('') + (q.type === 'pick' ? (q.kind === 'i' ? '<li>Ninguno de estos</li>' : '<li>Las dos</li><li>Ninguna</li>') : '');
    h += '<div class="qrow"><span class="tiny muted">' + esc(q.cat) + '</span><b style="font-weight:500">' + q.n + '. ' + esc(q.text) + '</b><ul>' + opts + '</ul></div>';
  });
  app.innerHTML = h + '</div></div>'; $('#back').onclick = back;
}

/* render */
function render() {
  clearTimeout(vAnalyzing.t);
  const noNav = FLOW.includes(S.v) || (S.v === 'career' && (S.from === 'result')) || S.v === 'all';
  const main = $('#app'); main.className = noNav ? '' : 'hasnav';
  ({ home: vHome, careers: vCareers, reels: vReels, profile: vProfile, data: vData, q: vQ, analyzing: vAnalyzing, result: vResult, career: vCareer, team: vTeam, all: vAll }[S.v] || vHome)();
  const nb = $('#bnav'); nb.hidden = noNav;
  const active = { home: 'home', careers: 'careers', career: S.from === 'careers' || S.from === 'home' ? (S.from) : 'careers', reels: 'reels', profile: 'profile' }[S.v];
  nb.querySelectorAll('[data-tab]').forEach(b => { b.setAttribute('aria-current', b.dataset.tab === active ? 'page' : 'false'); });
  document.documentElement.classList.toggle('big', !!S.big);
  window.scrollTo(0, 0);
  if (S.v === 'q') { const t = $('#qt'); if (t) { t.tabIndex = -1; } }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (act === 'start') { if (S.v === 'q') return; S.a = newA(); S.stack = []; nav('data'); }
  else if (act === 'soon') toast('Muy pronto');
  else if (act.startsWith('tab:')) tab(act.slice(4));
  else if (act.startsWith('career:')) nav('career', { career: act.slice(7), from: S.v });
});
document.addEventListener('change', e => {
  const c = e.target.closest('[data-cmp]'); if (!c) return;
  S.cmp[Number(c.dataset.cmp)] = c.value; $('#cmp').innerHTML = cmpHtml();
  const n = app.querySelector('[data-cmp="' + c.dataset.cmp + '"]'); if (n) n.focus();
});
$('#bnav').querySelectorAll('[data-tab]').forEach(b => { b.onclick = () => { const v = b.dataset.tab; if (v === 'test') { S.a = newA(); S.stack = []; nav('data'); } else tab(v); }; });
$('#logo').onclick = () => tab('home');
$('#qm').onclick = () => { S.stack = []; repl('team'); };
$('#aa').onclick = e => { S.big = !S.big; e.currentTarget.setAttribute('aria-pressed', String(S.big)); document.documentElement.classList.toggle('big', S.big); };

window.RUMBO = { Q, CAREERS, DEMOS, score, rank, reasons, profileOf, ART, recolor, INT, SK, profileName, profileText, get S() { return S; } };
render();

})();
</script>
