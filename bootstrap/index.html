<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rumbo · Test vocacional</title>
  <meta name="description" content="Rumbo: respondé 16 preguntas y descubrí qué carreras encajan con vos.">
  <meta name="theme-color" content="#0E6E78">

  <!-- Bootstrap 5 (CSS) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Íconos de Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Tipografía Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- Estilos propios de Rumbo -->
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>

  <!-- ENCABEZADO -->
  <header class="rumbo-header sticky-top">
    <div class="contenedor d-flex align-items-center justify-content-between">
      <button class="btn btn-outline-secondary btn-sm rounded-circle btn-redondo" id="btn-letra" aria-pressed="false" aria-label="Letra grande" title="Letra grande">Aa</button>
      <button class="btn p-0 border-0" id="btn-logo" aria-label="Rumbo, ir al inicio">
        <img src="img/logo.png" alt="Rumbo" width="127" height="28">
      </button>
      <span class="btn-redondo" aria-hidden="true"></span>
    </div>
  </header>

  <!-- AQUÍ SE DIBUJA CADA PANTALLA (la llena js/app.js) -->
  <main id="app" class="contenedor px-0" tabindex="-1"></main>

  <!-- MENÚ DE ABAJO -->
  <nav class="navbar fixed-bottom rumbo-nav p-0" id="menu" aria-label="Navegación principal">
    <div class="contenedor d-grid w-100" style="grid-template-columns: repeat(5, 1fr);">
      <button class="btn btn-nav" data-pestana="inicio"><i class="bi bi-house" aria-hidden="true"></i><span>Inicio</span></button>
      <button class="btn btn-nav" data-pestana="carreras"><i class="bi bi-mortarboard" aria-hidden="true"></i><span>Carreras</span></button>
      <button class="btn btn-nav btn-nav-test" data-pestana="test" aria-label="Hacer el test"><b><i class="bi bi-plus-lg" aria-hidden="true"></i></b><span>Test</span></button>
      <button class="btn btn-nav" data-pestana="reels"><i class="bi bi-play-btn" aria-hidden="true"></i><span>Reels</span></button>
      <button class="btn btn-nav" data-pestana="perfil"><i class="bi bi-person-circle" aria-hidden="true"></i><span>Perfil</span></button>
    </div>
  </nav>

  <!-- VENTANA EMERGENTE (modal de Bootstrap): resultado estimado cada 4 preguntas -->
  <div class="modal fade" id="modal-bloque" tabindex="-1" aria-labelledby="modal-titulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <p class="small text-secondary mb-0" id="modal-bloque-n"></p>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Seguir respondiendo"></button>
        </div>
        <div class="modal-body" id="modal-cuerpo"></div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-outline-primary" id="modal-ver">Ver resultado</button>
          <button type="button" class="btn btn-primary" id="modal-seguir">Seguir</button>
        </div>
      </div>
    </div>
  </div>

  <!-- AVISO CHICO (toast de Bootstrap) -->
  <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 2000">
    <div id="aviso" class="toast text-bg-dark border-0" role="status" aria-live="polite" aria-atomic="true">
      <div class="toast-body" id="aviso-texto"></div>
    </div>
  </div>

  <!-- Bootstrap 5 (JavaScript) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Código de Rumbo (el orden importa) -->
  <script src="js/datos.js"></script>
  <script src="js/ilustraciones.js"></script>
  <script src="js/puntaje.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
